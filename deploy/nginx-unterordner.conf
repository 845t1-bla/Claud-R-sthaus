# Variante: App in einem Unterordner einer bestehenden Website,
# z. B. https://www.beispiel.de/ruesthaus/
# Diese Blöcke in den BESTEHENDEN server { ... }-Block der Website einfügen.
# Voraussetzung: Das Paket wurde mit APP_BASE=/ruesthaus/ gebaut
# (steht in VERSION.txt im Paket) und liegt unter /var/www/ruesthaus/.

    location /ruesthaus/assets/ {
        root /var/www;
        expires 1y;
        try_files $uri =404;
    }

    location = /ruesthaus/index.html {
        root /var/www;
        expires -1;
    }

    location /ruesthaus/ {
        root /var/www;
        try_files $uri $uri/ /ruesthaus/index.html;
    }
