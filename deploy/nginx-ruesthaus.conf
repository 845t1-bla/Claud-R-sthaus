# nginx-Konfiguration für die Rüsthaus-App (eigene Subdomain)
# Ablage: /etc/nginx/sites-available/ruesthaus
# "ruesthaus.beispiel.de" überall durch die echte Adresse ersetzen.
# HTTPS ergänzt certbot anschließend automatisch (siehe ANLEITUNG-SERVER.md).

server {
    listen 80;
    listen [::]:80;
    server_name ruesthaus.beispiel.de;

    root /var/www/ruesthaus;
    index index.html;

    # Sicherheits-Header
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Komprimierung
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Dateien mit Hash im Namen: lange cachen
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html nie cachen, damit Updates sofort ankommen
    location = /index.html {
        expires -1;
    }

    # Single-Page-App: alle unbekannten Pfade liefern index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
