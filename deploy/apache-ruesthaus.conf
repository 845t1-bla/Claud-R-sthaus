# Alternative zu nginx: Apache-Konfiguration (eigene Subdomain)
# Ablage: /etc/apache2/sites-available/ruesthaus.conf
# Aktivieren: sudo a2enmod headers expires && sudo a2ensite ruesthaus && sudo systemctl reload apache2
# HTTPS: sudo apt install python3-certbot-apache && sudo certbot --apache -d ruesthaus.beispiel.de

<VirtualHost *:80>
    ServerName ruesthaus.beispiel.de
    DocumentRoot /var/www/ruesthaus

    <Directory /var/www/ruesthaus>
        Require all granted
        Options -Indexes
        # Single-Page-App: unbekannte Pfade liefern index.html
        FallbackResource /index.html
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    <LocationMatch "^/assets/">
        ExpiresActive On
        ExpiresDefault "access plus 1 year"
    </LocationMatch>
    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>
</VirtualHost>
